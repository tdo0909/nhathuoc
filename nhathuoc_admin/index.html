<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5B3A91">
    <title>App Quản Trị - Nhà thuốc An Tâm</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://www.gstatic.com">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" media="all">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" media="all">
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script defer src="firebase-config.js?v=20260930"></script>
    <style>
        body {
            background: radial-gradient(circle at top right, rgba(114, 83, 167, 0.14), transparent 34%), linear-gradient(135deg, #FAF8FC 0%, #F2EEF7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(32px);
            opacity: 0.65;
            animation: floatGlow 8s ease-in-out infinite alternate;
        }
        body::before {
            width: 280px;
            height: 280px;
            background: rgba(114, 83, 167, 0.14);
            right: 8%;
            top: 7%;
        }
        body::after {
            width: 220px;
            height: 220px;
            background: rgba(166, 140, 207, 0.12);
            left: 8%;
            bottom: 10%;
            animation-delay: 1s;
        }
        .login-card {
            position: relative;
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(114, 83, 167, 0.16);
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(73, 55, 101, 0.18);
            overflow: hidden;
            backdrop-filter: blur(12px);
            animation: cardIn 0.5s cubic-bezier(0.2, 0.9, 0.2, 1) both;
        }
        .login-header {
            background: linear-gradient(135deg, #493765 0%, #5B3A91 60%, #7253A7 100%);
            color: #FFFFFF;
            padding: 30px 20px 32px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .login-header::before {
            content: "";
            position: absolute;
            inset: -30% -20% auto auto;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
        }
        .login-header i {
            animation: pulseIcon 2.2s ease-in-out infinite;
        }
        .btn-login {
            background: linear-gradient(135deg, #7253A7, #5B3A91);
            border: none;
            box-shadow: 0 12px 24px rgba(114, 83, 167, 0.28);
            border-radius: 12px;
            min-height: 48px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-login:active {
            transform: scale(0.98);
        }
        .form-control {
            min-height: 48px;
            border-radius: 12px;
            border: 1px solid rgba(120, 101, 156, 0.2);
            font-size: 14px;
        }
        .form-control:focus {
            border-color: rgba(114, 83, 167, 0.7);
            box-shadow: 0 0 0 0.2rem rgba(114, 83, 167, 0.18);
        }
        .app-badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(18px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes floatGlow {
            from { transform: translate3d(0, 0, 0) scale(0.96); }
            to { transform: translate3d(18px, -18px, 0) scale(1.08); }
        }
        @keyframes pulseIcon {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <div class="mb-2"><span class="app-badge"><i class="fa-solid fa-mobile-screen-button me-1"></i> App Quản Trị Mobile</span></div>
        <i class="fa-solid fa-prescription-bottle-medical fs-1 mb-2"></i>
        <h3 class="fw-bold mb-1">NHÀ THUỐC AN TÂM</h3>
        <p class="mb-0 text-white-50 fs-7">Hệ thống Quản trị Nhà thuốc Firebase Realtime</p>
    </div>

    <div class="p-4">
        <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label class="form-label fw-bold text-secondary">Tên đăng nhập Quản trị</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0" style="border-radius: 12px 0 0 12px;"><i class="fa-solid fa-user text-muted"></i></span>
                    <input type="text" id="usernameInput" class="form-control border-start-0" placeholder="Tên đăng nhập..." autocomplete="off" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold text-secondary">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0" style="border-radius: 12px 0 0 12px;"><i class="fa-solid fa-key text-muted"></i></span>
                    <input type="password" id="passwordInput" class="form-control border-start-0" placeholder="Mật khẩu..." autocomplete="new-password" required>
                    <button type="button" id="togglePasswordButton" class="btn btn-light border" aria-label="Hiện mật khẩu" title="Hiện mật khẩu" aria-controls="passwordInput" onclick="togglePasswordVisibility()">
                        <i class="fa-solid fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-login w-100 py-2 fw-bold text-white">
                <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> ĐĂNG NHẬP APP QUẢN TRỊ
            </button>
        </form>
    </div>
</div>

<script>
if (sessionStorage.getItem('admin_logged_in') === 'true') {
    window.location.href = 'dashboard.html';
}

function togglePasswordVisibility() {
    const passwordInput = document.getElementById('passwordInput');
    const toggleButton = document.getElementById('togglePasswordButton');
    const showPassword = passwordInput.type === 'password';
    const icon = toggleButton.querySelector('i');

    passwordInput.type = showPassword ? 'text' : 'password';
    toggleButton.setAttribute('aria-label', showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
    toggleButton.title = showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu';
    icon.classList.toggle('fa-eye', !showPassword);
    icon.classList.toggle('fa-eye-slash', showPassword);
}

function handleLogin(e) {
    e.preventDefault();
    const u = document.getElementById('usernameInput').value.trim();
    const p = document.getElementById('passwordInput').value.trim();
    const alertBox = document.getElementById('alertBox');

    alertBox.classList.add('d-none');

    if (!u || !p) {
        alertBox.innerText = 'Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu.';
        alertBox.classList.remove('d-none');
        return;
    }

    if (u === 'admin' && p === 'admin123') {
        sessionStorage.setItem('admin_logged_in', 'true');
        sessionStorage.setItem('admin_username', u);
        sessionStorage.setItem('admin_name', 'Quản trị viên An Tâm');
        window.location.href = 'dashboard.html';
        return;
    }

    if (!window.db || typeof window.db.ref !== 'function') {
        alertBox.innerText = 'Firebase chưa sẵn sàng. Vui lòng tải lại trang hoặc kiểm tra kết nối mạng.';
        alertBox.classList.remove('d-none');
        return;
    }

    db.ref('admins').once('value').then(snapshot => {
        const admins = snapshot.val();
        let found = false;

        if (admins) {
            Object.keys(admins).forEach(key => {
                const adm = admins[key];
                if (adm && adm.username === u && adm.password === p) {
                    found = true;
                    sessionStorage.setItem('admin_logged_in', 'true');
                    sessionStorage.setItem('admin_username', u);
                    sessionStorage.setItem('admin_name', adm.full_name || 'Admin');
                    window.location.href = 'dashboard.html';
                }
            });
        }

        if (!found) {
            alertBox.innerText = 'Mật khẩu hoặc tên đăng nhập không chính xác!';
            alertBox.classList.remove('d-none');
        }
    }).catch(err => {
        alertBox.innerText = 'Lỗi kết nối Firebase: ' + (err && err.message ? err.message : 'Không xác định');
        alertBox.classList.remove('d-none');
    });
}
</script>

<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
